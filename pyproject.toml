[project]
name = "paperbot"
version = "0.0.1"
description = "Phase 0: list Webull sandbox accounts and exit. No orders."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6",
  "webull-openapi-python-sdk",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
paperbot = "paperbot.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["paperbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
